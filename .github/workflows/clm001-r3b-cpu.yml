name: CLM-001-R3b CPU observation and storage contracts
on:
  push:
    branches: [codex/clm001-r3b-longitudinal]
  pull_request:
    paths:
      - 'research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3b/**'
      - 'tests/research/clm001_r3b/**'
      - 'shared/python/minicells_runtime/r3.py'
      - 'shared/python/minicells_artifacts/hf_storage.py'
      - '.github/workflows/clm001-r3b-cpu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CUDA_VISIBLE_DEVICES: ''
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU dependencies
        run: |
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest tokenizers==0.20.3 ruff==0.9.10 matplotlib
      - name: R3b and shared engineering lint
        run: ruff check research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3b tests/research/clm001_r3b shared/python/minicells_runtime shared/python/minicells_artifacts
      - name: Existing 81 tests and new R3b contracts
        run: python -m pytest -q tests/engineering tests/research/clm001_r3 tests/research/clm001_r3b --junitxml=r3b-cpu.xml
      - name: Frozen R3 unchanged
        run: |
          git fetch --depth=1 origin 52b1950b23debbcd3f808c10eb6e0d3ea2d317c6
          git diff --exit-code 52b1950b23debbcd3f808c10eb6e0d3ea2d317c6 -- research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3/implementation research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3/config research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3/SPEC.md
          git fetch --depth=1 origin 2e47a28a27a0932912673a1140e533e12abcc00a
          git diff --exit-code 2e47a28a27a0932912673a1140e533e12abcc00a -- research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clm001-r3b-cpu-evidence
          path: r3b-cpu.xml
