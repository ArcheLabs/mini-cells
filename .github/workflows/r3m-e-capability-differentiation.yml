name: R3m-E CPU Gate

on:
  pull_request:
  push:
    branches: [main, codex/r3m-stability-reorganization]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest pyyaml tokenizers
      - name: Run R3m-E CPU regression checks
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q tests/research/r3me
      - name: Reuse frozen R3m synthetic tests for anchor, proposal, Trust Region, Shadow and resume
        run: python research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3m/checks.py
      - name: Run frozen protocol CPU Gate
        run: python research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3m-e/run.py --mode cpu-gate --output /tmp/r3me-cpu-gate
