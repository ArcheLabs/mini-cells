name: Native CLM v0 M0/M1

on:
  push:
    branches:
      - codex/native-clm-v0-m0-m1
  pull_request:
    paths:
      - "src/minicells/native_clm_v0.py"
      - "src/minicells/native_clm_train.py"
      - "scripts/research/*native_clm_v0*"
      - "research/stages/06-native-clm/**"
      - "research/notebooks/06-native-clm/**"
      - "tests/research/06-native-clm/**"
      - ".github/workflows/native-clm-v0-m0-m1.yml"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Validate config and notebook JSON
        run: |
          python -m json.tool research/stages/06-native-clm/configs/native-clm-v0-m1-12m.json >/dev/null
          python -m json.tool research/notebooks/06-native-clm/native-clm-v0-m0-m1-kaggle.ipynb >/dev/null

      - name: Compile and lint
        run: |
          python -m py_compile \
            src/minicells/native_clm_v0.py \
            src/minicells/native_clm_train.py \
            scripts/research/run_native_clm_v0_m0.py \
            scripts/research/run_native_clm_v0_m1.py \
            scripts/research/prepare_native_clm_v0_m1_data.py \
            scripts/research/publish_native_clm_v0_m1.py
          ruff check --select F,E9 \
            src/minicells/native_clm_v0.py \
            src/minicells/native_clm_train.py \
            scripts/research/run_native_clm_v0_m0.py \
            scripts/research/run_native_clm_v0_m1.py \
            scripts/research/prepare_native_clm_v0_m1_data.py \
            scripts/research/publish_native_clm_v0_m1.py \
            tests/research/06-native-clm/test_native_clm_v0.py

      - name: Unit and training-runtime tests
        run: pytest -q tests/research/06-native-clm/test_native_clm_v0.py

      - name: M0 execution smoke
        run: |
          rm -rf /tmp/native-clm-m0
          python scripts/research/run_native_clm_v0_m0.py --output-dir /tmp/native-clm-m0
          python - <<'PY'
          import json
          data = json.load(open('/tmp/native-clm-m0/decision.json'))
          assert data['status'] == 'NATIVE_CLM_V0_M0_EXECUTION_SMOKE_PASS'
          assert data['pass'] is True
          assert all(data['gates'].values())
          print(data['gates'])
          PY

      - name: Canonical M1 scale guard
        run: |
          python - <<'PY'
          import json
          from minicells.native_clm_v0 import NativeCLM, NativeCLMConfig
          raw = json.load(open('research/stages/06-native-clm/configs/native-clm-v0-m1-12m.json'))
          model = NativeCLM(NativeCLMConfig(**raw['model']))
          counts = model.parameter_count()
          print(counts)
          assert 10_000_000 <= counts['total'] <= 15_000_000
          assert raw['model']['initial_cells'] == 8
          assert raw['model']['active_cells'] == 2
          assert raw['model']['n_layers'] == 6
          PY
