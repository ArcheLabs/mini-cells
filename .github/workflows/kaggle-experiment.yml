name: Kaggle Experiment

on:
  workflow_call:
    inputs:
      experiment:
        type: string
        default: "003"
      seed:
        type: string
        default: "42"
      session:
        type: string
        default: "reference"
      execute:
        type: boolean
        default: false
    secrets:
      KAGGLE_API_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      experiment:
        description: Experiment
        type: choice
        options: ["004", "003"]
        default: "004"
      seed:
        description: "Seed group: 004 uses 42/43/44; 003 uses 42/123/456"
        type: choice
        options: ["1", "2", "3"]
        default: "1"
      session:
        description: "004 only: reference (soft/fixed/global) or graph (graph/hard); run both per seed"
        type: choice
        options: ["reference", "graph"]
        default: "reference"
      execute:
        description: Start the registered GPU run; false prepares an offline notebook only
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kaggle-experiment
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONPATH: src:.
      EXPERIMENT: ${{ inputs.experiment }}
      SEED_GROUP: ${{ inputs.seed }}
      SESSION: ${{ inputs.session }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache/restore@v4
        if: ${{ inputs.experiment == '003' || inputs.experiment == '004' }}
        id: input_cache
        with:
          path: .research-input-state/
          key: research-input-v1-${{ inputs.experiment }}-${{ hashFiles('src/**/*.py', 'experiments/**/*.py', 'research/08-hybrid-clm/experiments/**/*.py', 'kaggle/**/*.py', 'research/08-hybrid-clm/experiments/*/config/*.yaml', 'research/08-hybrid-clm/experiments/*/protocol.json') }}
      - name: Select experiment and seed group
        run: python kaggle/session.py select --experiment "$EXPERIMENT" --group "$SEED_GROUP"
      - uses: actions/checkout@v4
        if: ${{ inputs.experiment == '003' || inputs.experiment == '004' }}
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: experiment-source
          persist-credentials: false
      - name: Preserve historical notebooks
        if: ${{ inputs.experiment != '003' && inputs.experiment != '004' }}
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          definition = Path(os.environ['DEFINITION'])
          Path('prepared-notebook').mkdir()
          for name in ('notebook.ipynb', 'experiment.yaml', 'README.md', 'analysis.md'):
              shutil.copyfile(definition.parent / name, Path('prepared-notebook') / name)
          if '${{ inputs.execute }}' == 'true':
              raise SystemExit('Historical 001/002 are archive records; use their original frozen launcher for explicit reproduction.')
          PY
      - name: Install pinned CPU preparation dependencies
        if: ${{ (inputs.experiment == '003' || inputs.experiment == '004') }}
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'kaggle==2.2.4' 'numpy==2.0.2' 'datasets==4.0.0' 'tokenizers==0.21.4' 'matplotlib==3.10.6'
      - name: Prepare fixed assets on CPU
        if: ${{ (inputs.experiment == '003' || inputs.experiment == '004') && env.REUSE_INPUT != 'true' }}
        working-directory: experiment-source
        run: python kaggle/prepare_assets.py --definition "$DEFINITION" --output ../prepared-assets
      - name: Reuse prepared data automatically
        if: ${{ (inputs.experiment == '003' || inputs.experiment == '004') && env.REUSE_INPUT == 'true' }}
        run: python kaggle/session.py reuse
      - name: Upload immutable Dataset before GPU work
        if: ${{ (inputs.experiment == '003' || inputs.experiment == '004') && inputs.execute && env.REUSE_INPUT != 'true' }}
        working-directory: experiment-source
        run: python kaggle/upload_assets.py ../prepared-assets
      - name: Remember uploaded data and source automatically
        if: ${{ (inputs.experiment == '003' || inputs.experiment == '004') && inputs.execute && env.REUSE_INPUT != 'true' }}
        run: python kaggle/session.py remember
      - uses: actions/cache/save@v4
        if: ${{ (inputs.experiment == '003' || inputs.experiment == '004') && inputs.execute && env.REUSE_INPUT != 'true' }}
        with:
          path: .research-input-state/
          key: ${{ steps.input_cache.outputs.cache-primary-key }}
      - name: Prepare notebook with embedded source and fixed Dataset
        working-directory: experiment-source
        if: ${{ (inputs.experiment == '003' || inputs.experiment == '004') }}
        run: |
          extra=()
          if [ "$EXPERIMENT" = "004" ]; then extra+=(--session "$SESSION"); fi
          python kaggle/submit.py --commit "$SOURCE_SHA" --seed "$SEED" --definition "$DEFINITION" --input-reference ../prepared-assets/input-reference.json --output ../prepared-notebook "${extra[@]}"
      - name: Preserve notebook and source identity
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: research-${{ inputs.experiment }}-seed-${{ env.SEED }}-preparation-${{ github.run_id }}
          path: |
            prepared-notebook/
            prepared-assets/input-reference.json
            prepared-assets/assets-manifest.json
            prepared-assets/train.npy
            prepared-assets/validation.npy
            prepared-assets/tokenizer.json
            prepared-assets/data.json
            prepared-assets/dataset-metadata.json
          if-no-files-found: warn
      - name: Run original Kaggle kernel and download its exact version
        id: gpu
        if: ${{ (inputs.experiment == '003' || inputs.experiment == '004') && inputs.execute }}
        run: python kaggle/run_remote.py --prepared prepared-notebook --output kaggle-output
      - name: Restore cumulative 004 evidence before collection
        if: ${{ always() && inputs.experiment == '004' && inputs.execute && steps.gpu.outcome != 'skipped' }}
        run: |
          test -f prepared-notebook/push.json
          branch="results/cell-graph-${SOURCE_SHA:0:12}"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            git fetch origin "refs/heads/$branch"
            git switch -c "$branch" FETCH_HEAD
          else
            code=$?
            if [ "$code" != "2" ]; then exit "$code"; fi
            git switch -c "$branch"
          fi
          echo "RESULTS_BRANCH=$branch" >> "$GITHUB_ENV"
      - name: Verify returned evidence and archive incomplete results too
        id: collect
        if: ${{ always() && (inputs.experiment == '003' || inputs.experiment == '004') && inputs.execute && steps.gpu.outcome != 'skipped' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          push = Path('prepared-notebook/push.json')
          if not push.exists():
              raise SystemExit('No pushed version exists; inspect preparation failure.')
          with Path(os.environ['GITHUB_ENV']).open('a') as handle:
              handle.write('KAGGLE_KERNEL_REF=' + json.loads(push.read_text())['kernel_ref'] + '\n')
          PY
          python kaggle/collect.py --download kaggle-output --preparation prepared-notebook/preparation.json --kernel-ref "$(python -c 'import json; print(json.load(open("prepared-notebook/push.json"))["kernel_ref"])')" --workflow-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Preserve returned outputs
        if: ${{ always() && inputs.execute }}
        uses: actions/upload-artifact@v4
        with:
          name: research-${{ inputs.experiment }}-seed-${{ env.SEED }}-evidence-${{ github.run_id }}
          path: |
            research/artifacts/${{ inputs.experiment }}-*/
            kaggle-output/**/*.json
            kaggle-output/**/*.jsonl
            kaggle-output/**/*.md
            kaggle-output/**/*.txt
            kaggle-output/**/*.log
            kaggle-output/**/*.png
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve checkpoints separately from Git
        if: ${{ always() && inputs.execute }}
        uses: actions/upload-artifact@v4
        with:
          name: research-${{ inputs.experiment }}-seed-${{ env.SEED }}-checkpoints-${{ github.run_id }}
          path: kaggle-output/**/*.pt
          if-no-files-found: warn
          retention-days: 30
      - name: Publish verified research archive as a pull request
        if: ${{ always() && steps.collect.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${RESULTS_BRANCH:-results/pipeline-v2-$GITHUB_RUN_ID}"
          if [ "$EXPERIMENT" != "004" ]; then git switch -c "$branch"; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/artifacts research/registry.yaml
          git commit -m "research: archive pipeline v2 experiment $EXPERIMENT seed $SEED"
          git push origin "$branch"
          python - <<'PY'
          from pathlib import Path
          Path('archive-pr.md').write_text('Verified source/config/protocol/input and result hashes. Includes incomplete or negative development evidence. Frozen decision retained. Checkpoints are stored separately.\n')
          PY
          existing="$(gh pr list --state open --head "$branch" --json url --jq '.[0].url // empty')"
          if [ -z "$existing" ]; then
            gh pr create --base main --head "$branch" --title "research: pipeline v2 experiment $EXPERIMENT" --body-file archive-pr.md
          else
            printf '%s\n' "$existing"
          fi
