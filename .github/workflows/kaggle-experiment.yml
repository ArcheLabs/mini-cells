name: Kaggle Experiment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaggle-experiment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check kaggle

      - name: Package formal experiment source from this commit
        run: |
          python - <<'PY'
          import base64
          import io
          import os
          import zipfile
          from pathlib import Path

          files = [
              "experiments/configs/routing/experiment-001.json",
              "experiments/runners/models.py",
              "experiments/runners/train.py",
          ]
          buffer = io.BytesIO()
          with zipfile.ZipFile(buffer, "w", zipfile.ZIP_DEFLATED) as archive:
              archive.writestr("experiments/__init__.py", "")
              archive.writestr("experiments/runners/__init__.py", "")
              for name in files:
                  archive.write(name, name)
          script_path = Path("kaggle/run_experiment.py")
          script = script_path.read_text(encoding="utf-8")
          script = script.replace("__EXPERIMENT_PAYLOAD__", base64.b64encode(buffer.getvalue()).decode("ascii"))
          script = script.replace("__EXPERIMENT_COMMIT__", os.environ["GITHUB_SHA"])
          script_path.write_text(script, encoding="utf-8")
          PY

      - name: Push kernel and capture its actual run reference
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          if not os.environ.get("KAGGLE_API_TOKEN", "").strip():
              raise SystemExit("Missing Actions secret: KAGGLE_API_TOKEN")

          from kaggle.api.kaggle_api_extended import KaggleApi
          from slugify import slugify

          metadata = json.loads(Path("kaggle/kernel-metadata.json").read_text(encoding="utf-8"))
          requested_id = metadata.get("id", "").strip()
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", requested_id):
              raise SystemExit("Set a valid owner/kernel-slug in kaggle/kernel-metadata.json.")
          owner, requested_slug = requested_id.split("/")
          if slugify(metadata.get("title", "")) != requested_slug:
              raise SystemExit("Kernel title must resolve to the slug in metadata id.")

          api = KaggleApi()
          api.authenticate()
          result = api.kernels_push("kaggle", timeout=3600)
          if result is None or result.error:
              raise SystemExit("Kaggle push failed: " + (result.error if result else "empty response"))

          url = result.url or ""
          parsed = urlsplit(url)
          match = re.fullmatch(
              r"/(?:code/)?([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)/?", parsed.path
          )
          if parsed.scheme != "https" or parsed.hostname not in {"www.kaggle.com", "kaggle.com"} or not match:
              raise SystemExit("Kaggle push returned an invalid kernel URL.")
          kernel_id = match.group(1)
          if kernel_id.split("/")[0] != owner:
              raise SystemExit("Kaggle push returned a different kernel owner.")
          version = result.versionNumber
          if not isinstance(version, int) or isinstance(version, bool) or version < 1:
              raise SystemExit("Kaggle push did not return a valid version number.")
          kernel_ref = f"{kernel_id}/{version}"
          print(f"Kaggle pushed version {version}: {url}", flush=True)
          if kernel_id != requested_id:
              print(f"Kaggle resolved {requested_id} to {kernel_id}; using the returned URL.")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"KAGGLE_KERNEL_ID={kernel_id}\n")
              env_file.write(f"KAGGLE_KERNEL_REF={kernel_ref}\n")
          PY

      - name: Wait for Kaggle run
        shell: bash
        run: |
          set -euo pipefail
          kernel_id="$KAGGLE_KERNEL_REF"
          for attempt in $(seq 1 160); do
            if ! status="$(kaggle kernels status "$kernel_id" 2>&1)"; then
              printf '%s\n' "$status"
              exit 1
            fi
            printf 'Kaggle status check %s/160: %s\n' "$attempt" "$status"
            normalized="$(printf '%s' "$status" | tr '[:upper:]' '[:lower:]')"
            if printf '%s' "$normalized" | grep -Eq '(^|[^a-z])(complete|completed|success)([^a-z]|$)'; then
              exit 0
            fi
            if printf '%s' "$normalized" | grep -Eq '(^|[^a-z])(error|errored|failed|failure)([^a-z]|$)'; then
              kaggle kernels logs "$kernel_id" || true
              exit 1
            fi
            sleep 30
          done
          echo "Kaggle run did not finish within 80 minutes including queue and output processing."
          kaggle kernels logs "$kernel_id" || true
          exit 1

      - name: Download Kaggle outputs and add run provenance
        if: ${{ always() && env.KAGGLE_KERNEL_REF != '' }}
        run: |
          set -euo pipefail
          mkdir -p kaggle-output
          kaggle kernels output "$KAGGLE_KERNEL_REF" --path kaggle-output
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          context = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "workflow_run": os.environ["GITHUB_SERVER_URL"]
              + "/"
              + os.environ["GITHUB_REPOSITORY"]
              + "/actions/runs/"
              + os.environ["GITHUB_RUN_ID"],
              "kaggle_kernel": os.environ["KAGGLE_KERNEL_ID"],
              "kaggle_kernel_ref": os.environ["KAGGLE_KERNEL_REF"],
          }
          Path("kaggle-output/github-context.json").write_text(
              json.dumps(context, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify the formal comparison completed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          reports = list(Path("kaggle-output").rglob("metrics.json"))
          completed = [
              json.loads(path.read_text(encoding="utf-8"))
              for path in reports
              if path.parent.name == "results"
          ]
          if len(completed) != 1 or not completed[0].get("comparable_at_full_budget"):
              raise SystemExit("Experiment 001 is incomplete; inspect the preserved artifacts.")
          PY

      - name: Store Kaggle results as a GitHub Actions artifact
        if: ${{ always() && env.KAGGLE_KERNEL_REF != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: experiment-001-${{ github.run_id }}
          path: kaggle-output/
          if-no-files-found: error
          retention-days: 30
