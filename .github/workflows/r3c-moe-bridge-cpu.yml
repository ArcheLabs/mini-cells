name: R3c MoE Bridge CPU
on:
  push:
    branches: [codex/r3c-moe-bridge]
  pull_request:
    paths:
      - 'research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3c/moe-bridge/**'
      - '.github/workflows/r3c-moe-bridge-cpu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy pytest ruff
      - name: Preserve historical experiments
        run: |
          git diff --exit-code d796eb815fb77549a594713a0d3bc5001bebbe4f HEAD -- research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3 research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3b
      - name: Synthetic CPU invariants
        run: python -m pytest -q research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3c/moe-bridge/tests
      - name: Lint new experiment
        run: ruff check --select F research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3c/moe-bridge
      - name: One launch CPU engineering
        run: python research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3c/moe-bridge/run.py --output /tmp/r3c-engineering
      - uses: actions/upload-artifact@v4
        with:
          name: r3c-synthetic-cpu-reports
          path: /tmp/r3c-engineering/reports
