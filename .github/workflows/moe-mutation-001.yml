name: MoE Mutation 001 engineering guard

on:
  pull_request:
    paths:
      - "src/minicells/moe_mutation.py"
      - "scripts/research/moe_mutation_001/**"
      - "research/validations/moe-mutation-001/**"
      - "notebooks/**"
      - "tests/test_moe_mutation.py"
      - ".github/workflows/moe-mutation-001.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engineering-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU research environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[lm,dev]'
      - name: Validate frozen JSON and notebook
        run: |
          python -m json.tool research/validations/moe-mutation-001/protocol.json >/dev/null
          python -m json.tool notebooks/kaggle/moe-mutation-001.ipynb >/dev/null
      - name: Compile runners
        run: |
          python -m py_compile \
            scripts/research/moe_mutation_001/run_seed.py \
            scripts/research/moe_mutation_001/aggregate.py \
            scripts/research/moe_mutation_001/publish.py
      - name: Lint mutation implementation
        run: |
          python -m ruff check \
            src/minicells/moe_mutation.py \
            scripts/research/moe_mutation_001 \
            tests/test_moe_mutation.py
      - name: Unit mutation tests
        run: python -m pytest -q tests/test_moe_mutation.py
