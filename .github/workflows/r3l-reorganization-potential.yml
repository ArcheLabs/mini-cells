name: R3l Long-Horizon Value CPU
on:
  push:
    branches: [codex/r3l-reorganization-potential]
  pull_request:
    paths:
      - 'research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3l/**'
      - 'scripts/run_r3l.py'
      - '.github/workflows/r3l-reorganization-potential.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  long-horizon:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy pyyaml ruff
      - run: python research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3l/checks.py
      - run: ruff check --config research/projects/cellular-language-models/experiments/006-path-first-clm/extension-parameter-depth/ruff.toml research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3l scripts/run_r3l.py
      - name: Historical implementations and results stay unchanged from the R3l branch point
        run: git diff --exit-code aca68cb3574f4c977892171baa7d69f4ec963007 HEAD -- research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3f-connection-admission research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3f-v2 research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3h research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3i research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3g research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3j research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3k
