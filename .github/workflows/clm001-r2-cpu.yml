name: CLM-001 R2 relative-Q and transaction gates
on:
  push:
    branches: [codex/clm001-r2]
  pull_request:
    paths:
      - 'research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r2/**'
      - 'tests/research/clm001_r2/**'
      - '.github/workflows/clm001-r2-cpu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ''
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU dependencies
        run: |
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest tokenizers==0.20.3 ruff==0.9.10
      - name: Lint R2
        run: ruff check --config research/projects/cellular-language-models/experiments/006-path-first-clm/extension-parameter-depth/ruff.toml research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r2 tests/research/clm001_r2
      - name: R2 synthetic CPU Gate
        run: python research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r2/run.py --mode cpu-preflight --output clm001-r2-evidence
      - name: Frozen R1 regression
        run: python -m pytest -q tests/research/clm001_qfirst
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clm001-r2-cpu-evidence
          path: clm001-r2-evidence/
