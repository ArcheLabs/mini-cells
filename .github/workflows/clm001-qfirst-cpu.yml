name: CLM-001 QFIRST CPU Oracle and isolation gates
on:
  push:
    branches: [codex/clm001-qfirst-integrated]
  pull_request:
    paths:
      - 'research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/**'
      - 'tests/research/clm001_qfirst/**'
      - '.github/workflows/clm001-qfirst-cpu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ''
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU dependencies only
        run: |
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest tokenizers==0.20.3 ruff==0.9.10
      - name: Lint new implementation and tests
        run: ruff check --config research/projects/cellular-language-models/experiments/006-path-first-clm/extension-parameter-depth/ruff.toml research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated tests/research/clm001_qfirst
      - name: Complete synthetic CPU Gate (no downloads, secrets or training data)
        run: python research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/run.py --mode cpu-preflight --output clm001-cpu-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clm001-qfirst-cpu-evidence
          path: clm001-cpu-evidence/
