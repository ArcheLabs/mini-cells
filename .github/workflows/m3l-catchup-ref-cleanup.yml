name: Temporary M3L catch-up ref cleanup

on:
  push:
    branches:
      - codex/native-clm-v0-m3l1-address-state-capacity
    paths:
      - '.github/workflows/m3l-catchup-ref-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete unused catch-up refs
        run: |
          for branch in \
            codex/native-clm-v0-m3l-main-catchup-2 \
            codex/native-clm-v0-m3l-main-catchup-final \
            codex/native-clm-v0-m3l-main-catchup-pr \
            codex/native-clm-v0-m3l-main-sync
          do
            git push origin --delete "$branch" || true
          done
