name: R3i Stable Co-Adaptation CPU
on:
  push:
    branches: [codex/r3i-stable-coadaptation]
  pull_request:
    paths:
      - 'research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3i/**'
      - 'scripts/run_r3i.py'
      - '.github/workflows/r3i-stable-coadaptation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stable-coadaptation:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy pyyaml ruff
      - run: python research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3i/checks.py
      - run: ruff check --config research/projects/cellular-language-models/experiments/006-path-first-clm/extension-parameter-depth/ruff.toml research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3i scripts/run_r3i.py
      - name: Historical R3f and R3f-v2 stay unchanged
        run: git diff --exit-code 21da882da9d94b1bdf5ba20ba7bb7021b3fd9c7c HEAD -- research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3f-connection-admission research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3f-v2
