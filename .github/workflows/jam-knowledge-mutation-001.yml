name: JAM Knowledge Mutation 001 engineering guard

on:
  pull_request:
    paths:
      - "src/minicells/moe_multicoordinate.py"
      - "scripts/research/jam_knowledge_mutation_001/**"
      - "research/validations/jam-knowledge-mutation-001/**"
      - "research/notebooks/07-safe-model-evolution/jam-knowledge-mutation-001-kaggle.ipynb"
      - "research/stages/07-safe-model-evolution/**"
      - "research/catalog.yaml"
      - "tests/test_jam_knowledge_mutation.py"
      - ".github/workflows/jam-knowledge-mutation-001.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engineering-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU research environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[lm,dev]'
      - name: Validate source-locked dataset and frozen protocol
        run: |
          python scripts/research/jam_knowledge_v0_1/validate_dataset.py
          python -m json.tool research/validations/jam-knowledge-mutation-001/protocol.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('research/validations/jam-knowledge-mutation-001/protocol.json').read_text())
          assert p['status'] == 'PROTOCOL_FROZEN_GPU_PENDING'
          assert p['formal_seeds'] == [26090711, 26090712, 26090713]
          assert p['mutation']['capacity_ladder'] == [1, 2, 4]
          assert p['mutation']['group_size'] == 32
          assert p['mutation']['expected_intermediate_size'] == 512
          assert p['dataset']['concept_count'] == 180
          assert p['history']['learner_visible_selection_prompts'] == 32
          assert p['history']['withheld_evaluation_prompts'] == 32
          PY
      - name: Compile runners
        run: |
          python -m py_compile \
            src/minicells/moe_multicoordinate.py \
            scripts/research/jam_knowledge_mutation_001/sequence.py \
            scripts/research/jam_knowledge_mutation_001/run_seed.py \
            scripts/research/jam_knowledge_mutation_001/run_formal_seed.py \
            scripts/research/jam_knowledge_mutation_001/aggregate.py \
            scripts/research/jam_knowledge_mutation_001/publish.py
      - name: Lint implementation
        run: |
          python -m ruff check --ignore SIM102,S110,BLE001,UP012 \
            src/minicells/moe_multicoordinate.py \
            scripts/research/jam_knowledge_mutation_001 \
            tests/test_jam_knowledge_mutation.py
      - name: Unit tests
        run: |
          python -m pytest -q \
            tests/test_jam_knowledge_mutation.py \
            tests/test_jam_knowledge_dataset.py \
            tests/test_granite_moe_layout.py \
            tests/test_moe_subexpert.py
