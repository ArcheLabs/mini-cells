name: Constructive CLM-005 scaffold removal / endogenous control

on:
  push:
    branches:
      - codex/constructive-clm-005-endogenous-control
    paths:
      - src/minicells/constructive_clm_005.py
      - scripts/research/run_constructive_clm_005.py
      - scripts/research/publish_constructive_clm_005.py
      - tests/research/04-continual-learning-core/test_constructive_clm_005.py
      - research/validations/constructive-clm-005-scaffold-removal/**
      - research/notebooks/constructive-clm-005-endogenous-control-kaggle.ipynb
      - .github/workflows/constructive-clm-005.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate frozen protocol and notebook
        run: |
          python -m json.tool research/validations/constructive-clm-005-scaffold-removal/protocol.json >/dev/null
          if [ -f research/notebooks/constructive-clm-005-endogenous-control-kaggle.ipynb ]; then
            python -m json.tool research/notebooks/constructive-clm-005-endogenous-control-kaggle.ipynb >/dev/null
          fi
      - name: Compile and lint
        run: |
          python -m py_compile src/minicells/constructive_clm_005.py scripts/research/run_constructive_clm_005.py scripts/research/publish_constructive_clm_005.py
          ruff check --select F,E9 src/minicells/constructive_clm_005.py scripts/research/run_constructive_clm_005.py scripts/research/publish_constructive_clm_005.py tests/research/04-continual-learning-core/test_constructive_clm_005.py
      - name: Unit tests
        run: pytest -q tests/research/04-continual-learning-core/test_constructive_clm_005.py
      - name: Controller smoke
        run: python scripts/research/run_constructive_clm_005.py --smoke >/tmp/clm005-smoke.json
      - name: Full development bridge seed 601
        run: |
          rm -rf /tmp/clm005-dev
          python scripts/research/run_constructive_clm_005.py --seed 601 --output-dir /tmp/clm005-dev
          python - <<'PY'
          import json
          data = json.load(open('/tmp/clm005-dev/decision.json'))
          assert data['status'] == 'DEVELOPMENT_RUN'
          assert data['scientific_decision'] is False
          assert data['formal_seeds'] == [90811, 90812, 90813]
          result = data['results'][0]
          print('development-pass', result['pass'])
          print('controller', result['controller_diagnostics'])
          print('acquisition', result['acquisition'])
          print('mutation', result['mutation'])
          print('final', result['final_composition'])
          print('shared', result['shared_substrate'])
          print('gates', result['gates'])
          assert result['pass'] is True
          PY

# Formal seeds 90811/90812/90813 are intentionally never run by CI.
