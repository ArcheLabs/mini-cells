name: Experiment 006 CPU Gate 0

on:
  push:
    branches: [codex/experiment-006-path-first-clm, codex/experiment-006-audit-fixes, codex/experiment-006-kaggle-dev-pilot]
  pull_request:
    paths:
      - 'research/projects/cellular-language-models/experiments/006-path-first-clm/**'
      - 'research/projects/cellular-language-models/experiments/006-path-first-clm/implementation/**'
      - 'tests/research/path_first_006/**'
      - '.github/workflows/experiment-006-cpu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-gate-0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest
      - name: Protect historical source and registry entries
        run: python tests/research/path_first_006/check_history.py
      - name: Test new paths and existing 005 components
        run: python -m pytest -q tests/research/path_first_006 tests/research/routing_005 --junitxml=gate0-tests.xml
      - name: Check all modules and Notebook cells
        run: |
          python -m compileall -q research/projects/cellular-language-models/experiments/006-path-first-clm/implementation research/projects/cellular-language-models/experiments/006-path-first-clm/implementation/run_experiment_006.py research/projects/cellular-language-models/experiments/006-path-first-clm/implementation/publish_experiment_006.py research/projects/cellular-language-models/experiments/006-path-first-clm/implementation/analyze_experiment_006.py
          python tests/research/path_first_006/check_notebook.py
          python tests/research/path_first_006/check_pilot_notebook.py
      - name: Count small and 61M candidate capacity and run CPU Gate 0
        run: |
          python research/projects/cellular-language-models/experiments/006-path-first-clm/implementation/run_experiment_006.py --mode preflight > gate0-small.json
          python research/projects/cellular-language-models/experiments/006-path-first-clm/implementation/run_experiment_006.py --mode preflight --config research/projects/cellular-language-models/experiments/006-path-first-clm/config/proposed-61m.json > gate0-large.json
          python research/projects/cellular-language-models/experiments/006-path-first-clm/implementation/run_experiment_006.py --mode dry-run > gate1-blocked.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment-006-cpu-evidence
          path: |
            gate0-tests.xml
            gate0-small.json
            gate0-large.json
            gate1-blocked.json
