name: FAST-001 CPU engineering gates
on:
  push:
    branches: [codex/fast001-joint-training]
  pull_request:
    paths:
      - 'research/projects/cellular-language-models/experiments/006-path-first-clm/extension-parameter-depth/exploration-fast-001/**'
      - 'tests/research/path_first_fast001/**'
      - '.github/workflows/fast001-cpu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest tokenizers==0.20.3 ruff==0.9.10
      - name: Fetch immutable read-only audit baseline
        run: git fetch --depth=1 origin 91b1340fbf5d00a386a5cce0a89a312d38113597
      - name: Ruff and Notebook source validation
        run: |
          ruff check --config research/projects/cellular-language-models/experiments/006-path-first-clm/extension-parameter-depth/ruff.toml research/projects/cellular-language-models/experiments/006-path-first-clm/extension-parameter-depth/exploration-fast-001 tests/research/path_first_fast001
          python tests/research/path_first_fast001/check_notebook.py
      - name: FAST CPU correctness, parameter, data, recovery and historical-protection tests
        run: python -m pytest -q tests/research/path_first_fast001 --junitxml=fast001-test-results.xml
      - name: Full candidate three-arm CPU Gate
        run: python research/projects/cellular-language-models/experiments/006-path-first-clm/extension-parameter-depth/exploration-fast-001/run_fast001.py --mode preflight --output fast001-ci-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast001-cpu-engineering
          path: |
            fast001-test-results.xml
            fast001-ci-evidence/
