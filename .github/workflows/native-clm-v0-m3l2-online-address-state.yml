name: Native CLM v0 M3L-2 Online Address State

on:
  push:
    branches: [codex/native-clm-v0-m3l2-online-address-state]
    paths:
      - 'src/minicells/native_clm_m3l2.py'
      - 'scripts/research/*m3l2*'
      - 'research/validations/native-clm-v0-m3l2-online-address-state/**'
      - 'research/notebooks/06-native-clm/native-clm-v0-m3l2-online-address-state-kaggle.ipynb'
      - 'tests/research/06-native-clm/test_native_clm_m3l2.py'
      - '.github/workflows/native-clm-v0-m3l2-online-address-state.yml'
  pull_request:
    paths:
      - 'src/minicells/native_clm_m3l2.py'
      - 'scripts/research/*m3l2*'
      - 'research/validations/native-clm-v0-m3l2-online-address-state/**'
      - 'research/notebooks/06-native-clm/native-clm-v0-m3l2-online-address-state-kaggle.ipynb'
      - 'tests/research/06-native-clm/test_native_clm_m3l2.py'
      - '.github/workflows/native-clm-v0-m3l2-online-address-state.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev,lm]'
      - name: Validate frozen M3L-2 boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research/validations/native-clm-v0-m3l2-online-address-state/protocol.json').read_text())
          assert p['format']=='minicells.native-clm-v0.m3l2-online-address-state.protocol.v1'
          assert p['status']=='FROZEN_UNRUN'
          assert p['address_state']['rank']==32
          assert p['address_state']['maximum_persistent_bytes_per_cell']==52360
          assert p['growth']['growth_check_interval']==50
          assert p['growth']['growth_cooldown_steps']==100
          assert p['growth']['max_new_cells']==8
          assert p['growth']['max_final_cells']==16
          assert p['formal_seeds']==[74211,74212,74213]
          assert set(p['formal_seeds']).isdisjoint(p['consumed_seeds_forbidden'])
          assert p['bootstrap']['A_bootstrap_access_after_B_starts'] is False
          assert p['learner_replay_bytes_after_continual_start']==0
          PY
      - name: Compile and lint
        run: |
          python -m compileall -q src/minicells/native_clm_m3l2.py scripts/research/run_native_clm_v0_m3l2.py scripts/research/prepare_native_clm_v0_m3l2_data.py
          ruff check src/minicells/native_clm_m3l2.py scripts/research/run_native_clm_v0_m3l2.py scripts/research/prepare_native_clm_v0_m3l2_data.py tests/research/06-native-clm/test_native_clm_m3l2.py
      - name: M3L-2 mechanics smoke
        run: pytest -q tests/research/06-native-clm/test_native_clm_m3l2.py
      - name: Formal seed guard
        run: |
          python - <<'PY'
          from pathlib import Path
          text='\n'.join(p.read_text() for p in [Path('.github/workflows/native-clm-v0-m3l2-online-address-state.yml'),Path('scripts/research/run_native_clm_v0_m3l2.py')])
          for seed in ('74211','74212','74213'):
              assert f'--seed {seed}' not in text
          forbidden='run_native_clm_v0_'+'m3r.py --formal'
          assert forbidden not in text
          print('M3L-2 formal seeds remain untouched by CI.')
          PY
