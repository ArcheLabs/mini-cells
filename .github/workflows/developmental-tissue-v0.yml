name: Developmental tissue v0

on:
  push:
    branches:
      - codex/developmental-tissue-v0
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q tests/test_developmental_tissue.py
      - name: Granularity smoke
        run: python scripts/run_experiment_026_cell_granularity_smoke.py
      - name: Ruff
        run: ruff check research/minicells/developmental_tissue.py tests/test_developmental_tissue.py scripts/run_experiment_026_cell_granularity_smoke.py
