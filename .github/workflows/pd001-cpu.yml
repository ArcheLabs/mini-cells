name: PD-001 CPU engineering gates
on:
  push:
    branches: [codex/pd001-parameter-depth, codex/automatic-development-flow, codex/pd001-performance-repair]
  pull_request:
    paths:
      - 'research/projects/cellular-language-models/experiments/006-path-first-clm/extension-parameter-depth/**'
      - 'tests/research/path_first_pd001/**'
      - '.github/workflows/pd001-cpu.yml'
      - 'shared/python/experiments/common/development.py'
      - 'AGENTS.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-gate0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU engineering dependencies
        run: |
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest ruff==0.9.10
      - name: Fetch actual previous-run source for equivalence tests
        run: git fetch --depth=1 --filter=blob:none origin 2e77369b0df1ce704863a815dacc48301736dde0
      - name: Ruff
        run: ruff check --config research/projects/cellular-language-models/experiments/006-path-first-clm/extension-parameter-depth/ruff.toml research/projects/cellular-language-models/experiments/006-path-first-clm/extension-parameter-depth/implementation research/projects/cellular-language-models/experiments/006-path-first-clm/extension-parameter-depth/run_pd001.py tests/research/path_first_pd001 shared/python/experiments/common/development.py
      - name: Joint credit, causal execution, STOP, resume and evidence gates
        run: python -m pytest -q tests/research/path_first_pd001 --junitxml=pd001-tests.xml
      - name: Actual-source CPU performance smoke (not a GPU benchmark)
        run: |
          git worktree add --detach /tmp/pd001-baseline 2e77369b0df1ce704863a815dacc48301736dde0
          python research/projects/cellular-language-models/experiments/006-path-first-clm/extension-parameter-depth/run_pd001.py --mode perf-audit --all-arms --perf-fixture --baseline-root /tmp/pd001-baseline --cases B0 LIGHT --warmup 1 --steps 2 --repeats 1 --output pd001-ci-evidence/performance-smoke
      - name: Full-size CPU Gate 0
        run: python research/projects/cellular-language-models/experiments/006-path-first-clm/extension-parameter-depth/run_pd001.py --mode preflight --output pd001-ci-evidence
      - name: Protect historical research
        run: |
          python research/projects/cellular-language-models/experiments/006-path-first-clm/extension-parameter-depth/run_pd001.py --mode audit --output pd001-ci-evidence
          python tests/research/path_first_pd001/check_notebook.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pd001-cpu-gate0
          path: |
            pd001-tests.xml
            pd001-ci-evidence/
