name: Temporary M3L-1 import correction

on:
  push:
    branches:
      - codex/native-clm-v0-m3l1-address-state-capacity
    paths:
      - '.github/workflows/m3l1-import-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/native-clm-v0-m3l1-address-state-capacity
      - name: Apply exact Ruff import correction
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/minicells/native_clm_m3l1_capacity.py')
          text = path.read_text()
          old = '''from .native_clm_m3l_gate import (\n    M3LQuerySketchConfig,\n    LowRankGaussianSketch,\n'''
          new = '''from .native_clm_m3l_gate import (\n    LowRankGaussianSketch,\n    M3LQuerySketchConfig,\n'''
          if old not in text:
              raise SystemExit('expected M3L-1 import block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'MiniCells Research'
          git config user.email 'research@minicells.local'
          git add src/minicells/native_clm_m3l1_capacity.py
          git commit -m 'style: fix M3L-1 import order'
          git push origin HEAD:codex/native-clm-v0-m3l1-address-state-capacity
