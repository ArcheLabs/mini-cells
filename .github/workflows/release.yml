name: Python package release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist --wheel --outdir dist
          python -m twine check dist/*
      - name: Clean-wheel install smoke test
        run: |
          python -m venv "${RUNNER_TEMP}/minicells-release-smoke"
          "${RUNNER_TEMP}/minicells-release-smoke/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/minicells-release-smoke/bin/python" - <<'PY'
          from minicells import CellMutation, CellPlacement, HybridCLM, ModelInspection
          assert all((CellMutation, CellPlacement, HybridCLM, ModelInspection))
          print('release wheel install and public API import: PASS')
          PY
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: minicells-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mini-cells
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: minicells-distributions
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
