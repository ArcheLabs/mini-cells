name: Functional Boundary Oracle 001 engineering guard

on:
  pull_request:
    paths:
      - "src/minicells/moe_subexpert.py"
      - "scripts/research/functional_boundary_oracle_001/**"
      - "research/validations/functional-boundary-oracle-001/**"
      - "notebooks/kaggle/functional-boundary-oracle-001.ipynb"
      - "tests/test_moe_subexpert.py"
      - ".github/workflows/functional-boundary-oracle-001.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engineering-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU research environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[lm,dev]'
      - name: Validate frozen assets
        run: |
          python -m json.tool research/validations/functional-boundary-oracle-001/protocol.json >/dev/null
          python -m json.tool notebooks/kaggle/functional-boundary-oracle-001.ipynb >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('research/validations/functional-boundary-oracle-001/protocol.json').read_text())
          select = p['history']['selection_prompts']
          evaluate = p['history']['evaluation_prompts']
          assert len(select) == 32
          assert len(evaluate) == 32
          assert not (set(select) & set(evaluate))
          assert p['mutation']['expected_intermediate_size'] % p['mutation']['group_size'] == 0
          assert p['mutation']['groups_per_expert'] == p['mutation']['expected_intermediate_size'] // p['mutation']['group_size']
          assert p['gates']['maximum_expert_fraction'] == p['mutation']['group_size'] / p['mutation']['expected_intermediate_size']
          PY
      - name: Compile runners
        run: |
          python -m py_compile \
            scripts/research/functional_boundary_oracle_001/run_seed.py \
            scripts/research/functional_boundary_oracle_001/run_formal_seed.py \
            scripts/research/functional_boundary_oracle_001/aggregate.py \
            scripts/research/functional_boundary_oracle_001/publish.py
      - name: Lint implementation
        run: |
          python -m ruff check \
            src/minicells/moe_subexpert.py \
            scripts/research/functional_boundary_oracle_001 \
            tests/test_moe_subexpert.py
      - name: Unit tests
        run: python -m pytest -q tests/test_moe_subexpert.py
