name: R3m-F CPU Gate
on:
  pull_request:
  push:
    branches: [main, codex/r3m-f-arithmetic-specialization]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest pyyaml tokenizers
      - name: R3m-F correctness and inherited R3m-E regressions
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q tests/research/r3mf tests/research/r3me
      - name: Frozen protocol CPU Gate
        run: python research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3m-f/run.py --mode cpu-gate --output /tmp/r3mf-cpu-gate
