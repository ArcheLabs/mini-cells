name: PCU Hybrid Reattachment 001

on:
  push:
    branches:
      - codex/pcu-hybrid-reattachment-001
  workflow_dispatch:

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Reattachment unit guards
        run: pytest -q tests/research/05-pcu-kill-001/test_pcu_hybrid_reattachment_001.py
      - name: Compile runner and implementation
        run: python -m py_compile src/minicells/pcu_kill_001/hybrid_reattachment.py scripts/research/run_pcu_hybrid_reattachment_001.py
      - name: Validate Kaggle notebook JSON
        run: python -m json.tool research/notebooks/08-pretrained-model-lift/pcu-hybrid-reattachment-001-kaggle.ipynb >/dev/null
      - name: Semantic Ruff checks
        run: >-
          ruff check --select F,E9
          src/minicells/pcu_kill_001/hybrid_reattachment.py
          scripts/research/run_pcu_hybrid_reattachment_001.py
          tests/research/05-pcu-kill-001/test_pcu_hybrid_reattachment_001.py
