name: M3L Query-Sketch Style Fix

on:
  push:
    branches:
      - codex/native-clm-v0-m3l-learned-lineage-gate
    paths:
      - '.github/workflows/m3l-query-sketch-style-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q ruff
      - name: Apply deterministic Ruff fixes
        run: |
          ruff check --fix --unsafe-fixes \
            src/minicells/native_clm_m3l_gate.py \
            tests/research/06-native-clm/test_native_clm_m3l_gate.py
          if ! git diff --quiet; then
            git config user.name 'MiniCells Research'
            git config user.email 'research@minicells.local'
            git add src/minicells/native_clm_m3l_gate.py tests/research/06-native-clm/test_native_clm_m3l_gate.py
            git commit -m 'style: apply M3L query-sketch Ruff fixes'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
