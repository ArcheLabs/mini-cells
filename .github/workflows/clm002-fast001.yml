name: CLM-002 FAST-001 CPU gate
on:
  workflow_dispatch:
  push:
    branches: [codex/clm002-fast-001]
    paths:
      - 'research/projects/cellular-language-models/experiments/clm-002-fast-001/implementation/**'
      - 'research/projects/cellular-language-models/experiments/clm-002-fast-001/config/**'
      - 'research/projects/cellular-language-models/experiments/clm-002-fast-001/run.py'
      - 'tests/research/clm002_fast/**'
      - '.github/workflows/clm002-fast001.yml'
  pull_request:
    paths:
      - 'research/projects/cellular-language-models/experiments/clm-002-fast-001/**'
      - 'tests/research/clm002_fast/**'
      - '.github/workflows/clm002-fast001.yml'
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==1.24.4 tokenizers==0.20.3 pytest==8.3.5 ruff==0.16.6
      - name: Lint only the new FAST implementation and necessary tests
        run: python -m ruff check research/projects/cellular-language-models/experiments/clm-002-fast-001 tests/research/clm002_fast
      - name: FAST CPU mechanism, data and gate tests
        run: python -m pytest -q tests/research/clm002_fast
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
