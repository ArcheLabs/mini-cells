name: MiniCells Stage-1 boundary and contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce application-neutral Stage-1 boundary
        run: ./tools/check_stage1_boundary.sh

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public MiniJAM Stage-1 contract
        run: ./tools/check_minijam_contract.sh
