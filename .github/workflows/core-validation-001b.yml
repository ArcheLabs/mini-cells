name: Core Validation 001b residual memorization

on:
  push:
    branches:
      - codex/core-validation-001b-residual-memorization
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Core Validation tests
        run: pytest -q tests/test_core_validation_001.py tests/test_core_validation_001b.py
      - name: Validate assets
        run: |
          python -m json.tool research/validations/core-001b-residual-memorization/protocol.json >/dev/null
          python -m json.tool research/kaggle/core-validation-001b-residual-memorization.ipynb >/dev/null
          python -m py_compile \
            research/minicells/residual_memorization.py \
            scripts/analyze_core_validation_001b.py \
            scripts/report_core_validation_001b.py \
            scripts/publish_core_validation_001b.py
      - name: Semantic Ruff checks
        run: >-
          ruff check --select F,E9
          research/minicells/residual_memorization.py
          scripts/analyze_core_validation_001b.py
          scripts/report_core_validation_001b.py
          scripts/publish_core_validation_001b.py
          tests/test_core_validation_001b.py
