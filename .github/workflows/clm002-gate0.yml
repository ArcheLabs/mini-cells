name: CLM-002 Gate 0 CPU engineering
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/projects/cellular-language-models/experiments/clm-002-cell-differentiation-joint-value/**'
      - 'tests/research/clm002/**'
      - '.github/workflows/clm002-gate0.yml'
  push:
    branches: [codex/clm002-differentiation-joint-value]
    paths:
      - 'research/projects/cellular-language-models/experiments/clm-002-cell-differentiation-joint-value/implementation/**'
      - 'tests/research/clm002/**'
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==1.24.4 tokenizers==0.20.3 pytest==8.3.5 ruff==0.16.6
      - run: ruff check research/projects/cellular-language-models/experiments/clm-002-cell-differentiation-joint-value/implementation research/projects/cellular-language-models/experiments/clm-002-cell-differentiation-joint-value/run.py tests/research/clm002
      - run: python -m pytest -q tests/research/clm002
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
