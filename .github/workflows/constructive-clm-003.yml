name: Constructive CLM-003 protected learned/growing Cells

on:
  push:
    branches:
      - codex/constructive-clm-003-protected-growing-cells
    paths:
      - src/minicells/constructive_clm_003.py
      - scripts/research/run_constructive_clm_003.py
      - tests/research/04-continual-learning-core/test_constructive_clm_003.py
      - research/validations/constructive-clm-003-protected-growing-cells/**
      - .github/workflows/constructive-clm-003.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate frozen protocol
        run: python -m json.tool research/validations/constructive-clm-003-protected-growing-cells/protocol.json >/dev/null
      - name: Compile and lint
        run: |
          python -m py_compile src/minicells/constructive_clm_003.py scripts/research/run_constructive_clm_003.py
          ruff check --select F,E9 src/minicells/constructive_clm_003.py scripts/research/run_constructive_clm_003.py tests/research/04-continual-learning-core/test_constructive_clm_003.py
      - name: Unit tests
        run: pytest -q tests/research/04-continual-learning-core/test_constructive_clm_003.py
      - name: Protection-only smoke
        run: python scripts/research/run_constructive_clm_003.py --smoke >/tmp/clm003-smoke.json
      - name: Show smoke summary
        run: python - <<'PY'
          import json
          data=json.load(open('/tmp/clm003-smoke.json'))
          for name,row in data['variants'].items():
              print(name, {
                  'cells': row['final_cells'],
                  'gain': row['acquisition_gain'],
                  'history_mse': row['final_historical_regression_mse'],
                  'replay': row['replay_accesses'],
                  'route': row['route']['exact_mode_accuracy'],
                  'tail_spawns': row['tail_spawns'],
              })
          PY

# Formal seeds 90511/90512/90513 are intentionally NOT run by CI.
# They remain reserved for an explicit reviewed `--formal` execution.
