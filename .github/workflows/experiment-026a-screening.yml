name: Experiment 026a screening

on:
  push:
    branches:
      - codex/experiment-026a-granularity-screening
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Developmental tissue regression
        run: pytest -q tests/test_developmental_tissue.py
      - name: Experiment 026 mechanism tests
        run: pytest -q tests/test_experiment_026_cell_granularity.py
      - name: Experiment 026a protocol tests
        run: pytest -q tests/test_experiment_026a_screening.py
      - name: Granularity function smoke
        run: python scripts/run_experiment_026_cell_granularity_smoke.py
      - name: Validate assets
        run: |
          python -m json.tool research/stages/03-routing-and-growth/sources/experiment-026a-protocol.json >/dev/null
          python -m json.tool research/kaggle/experiment-026a-granularity-screening.ipynb >/dev/null
          python -m py_compile scripts/run_experiment_026a_granularity_screening.py scripts/report_experiment_026a_granularity_screening.py
      - name: Semantic Ruff checks
        run: >-
          ruff check --select F,E9
          scripts/run_experiment_026a_granularity_screening.py
          scripts/report_experiment_026a_granularity_screening.py
          tests/test_experiment_026a_screening.py
