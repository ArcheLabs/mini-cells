name: R3d Long Horizon Credit CPU
on:
  push:
    branches: [codex/r3d-long-horizon-credit]
  pull_request:
    paths:
      - 'research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3d/**'
      - 'scripts/run_r3d.py'
      - '.github/workflows/r3d-long-horizon-credit-cpu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy pytest pyyaml ruff
      - name: Preserve historical experiment implementations
        run: git diff --exit-code 73db5a5853ee40d298d15bc92ab95748dd09c70f HEAD -- research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3 research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3b research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3c
      - name: Focused synthetic correctness (no assets, secrets or GPU)
        run: python -m pytest -q research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3d/tests
      - name: Lint
        run: ruff check --config research/projects/cellular-language-models/experiments/006-path-first-clm/extension-parameter-depth/ruff.toml research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3d scripts/run_r3d.py
