name: JCT-001 CPU engineering
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/projects/cellular-language-models/experiments/jct-001/**'
      - 'tests/research/jct001/**'
      - '.github/workflows/jct001-engineering.yml'
  push:
    branches: [codex/jct-001-engineering]
    paths:
      - 'research/projects/cellular-language-models/experiments/jct-001/implementation/**'
      - 'research/projects/cellular-language-models/experiments/jct-001/run.py'
      - 'tests/research/jct001/**'
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==1.24.4 tokenizers==0.20.3 pytest==8.3.5 ruff==0.16.6
      - run: ruff check research/projects/cellular-language-models/experiments/jct-001/implementation research/projects/cellular-language-models/experiments/jct-001/run.py research/projects/cellular-language-models/experiments/jct-001/gpu_run.py tests/research/jct001
      - run: python -m pytest -q tests/research/jct001
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
