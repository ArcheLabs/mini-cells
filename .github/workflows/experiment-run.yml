name: Experiment Notebook Preparation
on:
  workflow_dispatch:
    inputs:
      seed:
        description: Experiment 003 development seed
        type: choice
        options: ['42', '123', '456']
        default: '123'
      submit:
        description: Run the original Kaggle kernel with fixed Dataset inputs
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
jobs:
  pipeline:
    uses: ./.github/workflows/kaggle-experiment.yml
    with:
      experiment: '003'
      seed: ${{ inputs.seed }}
      execute: ${{ inputs.submit }}
    secrets: inherit
