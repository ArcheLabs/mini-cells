name: Kaggle continuation engineering CPU gates
on:
  push:
    branches: [codex/kaggle-continuation-engineering, codex/hf-checkpoint-storage]
  pull_request:
    paths:
      - 'shared/python/minicells_runtime/**'
      - 'shared/python/minicells_artifacts/**'
      - 'research/projects/cellular-language-models/engineering/hf-checkpoint-storage/**'
      - 'tests/engineering/**'
      - 'research/projects/cellular-language-models/engineering/kaggle-continuation/**'
      - '.github/workflows/kaggle-continuation-cpu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ''
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU dependencies
        run: |
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest tokenizers==0.20.3 ruff==0.9.10
      - name: Engineering lint
        run: ruff check shared/python/minicells_runtime shared/python/minicells_artifacts tests/engineering research/projects/cellular-language-models/engineering/kaggle-continuation/run.py research/projects/cellular-language-models/engineering/hf-checkpoint-storage/run.py
      - name: Continuation and frozen R3 regression
        run: python -m pytest -q tests/engineering tests/research/clm001_r3 --junitxml=continuation-cpu.xml
      - name: Verify historical research files unchanged
        run: |
          git fetch --depth=1 origin 52b1950b23debbcd3f808c10eb6e0d3ea2d317c6
          git diff --exit-code 52b1950b23debbcd3f808c10eb6e0d3ea2d317c6 -- research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaggle-continuation-cpu-evidence
          path: continuation-cpu.xml
