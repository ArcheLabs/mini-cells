name: CLM003 Phase0 CPU
on:
  workflow_dispatch:
  push:
    branches: [codex/fast002-r1-stateful-calibration]
    paths: ['research/projects/cellular-language-models/experiments/clm-003-routing-value-benchmark/**', 'tests/research/clm003/**', '.github/workflows/clm003-phase0.yml']
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==1.24.4 tokenizers==0.20.3 pytest==8.3.5 ruff==0.16.6
      - run: python -m ruff check research/projects/cellular-language-models/experiments/clm-003-routing-value-benchmark tests/research/clm003
      - run: python -m pytest -q tests/research/clm003
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
