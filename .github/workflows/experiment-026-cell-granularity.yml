name: Experiment 026 cell granularity

on:
  push:
    branches:
      - codex/experiment-026-cell-granularity
  pull_request:
    paths:
      - "research/minicells/developmental_tissue.py"
      - "research/minicells/granularity_30m.py"
      - "research/experiment-026-protocol.json"
      - "scripts/run_experiment_026_cell_granularity.py"
      - "scripts/run_experiment_026_cell_granularity_worker.py"
      - "scripts/report_experiment_026_cell_granularity.py"
      - "tests/test_experiment_026_cell_granularity.py"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Developmental tissue regression
        run: pytest -q tests/test_developmental_tissue.py
      - name: Experiment 026 tests
        run: pytest -q tests/test_experiment_026_cell_granularity.py
      - name: Granularity function smoke
        run: python scripts/run_experiment_026_cell_granularity_smoke.py
      - name: Ruff
        run: >-
          ruff check
          research/minicells/developmental_tissue.py
          research/minicells/granularity_30m.py
          scripts/run_experiment_026_cell_granularity.py
          scripts/run_experiment_026_cell_granularity_worker.py
          scripts/report_experiment_026_cell_granularity.py
          tests/test_developmental_tissue.py
          tests/test_experiment_026_cell_granularity.py
