name: R3e Focused CPU Correctness
on:
  push:
    branches: [codex/r3e-stable-coadaptation]
  pull_request:
    paths:
      - 'research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3e/**'
      - 'scripts/run_r3e.py'
      - '.github/workflows/r3e-stable-coadaptation.yml'
      - 'shared/scripts/ci/r3e_scope.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy pyyaml ruff
      - name: Focused synthetic R3e invariants only
        run: python research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3e/checks.py
      - name: Lint R3e only
        run: ruff check --config research/projects/cellular-language-models/experiments/006-path-first-clm/extension-parameter-depth/ruff.toml research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3e scripts/run_r3e.py shared/scripts/ci/r3e_scope.py
      - name: Historical implementation byte identity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: git diff --exit-code "$BASE_SHA" HEAD -- research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3 research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3b research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3c research/projects/cellular-language-models/experiments/clm-001-qfirst-integrated/r3d
