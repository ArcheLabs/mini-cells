name: Core Validation 001 knowledge subsumption

on:
  push:
    branches:
      - codex/core-validation-001-knowledge-subsumption
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Core Validation 001 unit tests
        run: pytest -q tests/test_core_validation_001.py
      - name: CPU smoke
        run: |
          python scripts/run_core_validation_001.py --smoke --device cpu --skip-oracle
          python scripts/report_core_validation_001.py
      - name: Validate assets
        run: |
          python -m json.tool research/core-validation-001-protocol.json >/dev/null
          python -m json.tool research/kaggle/core-validation-001-knowledge-subsumption.ipynb >/dev/null
          python -m py_compile research/minicells/knowledge_subsumption.py scripts/run_core_validation_001.py scripts/report_core_validation_001.py scripts/publish_core_validation_001.py
      - name: Semantic Ruff checks
        run: >-
          ruff check --select F,E9
          research/minicells/knowledge_subsumption.py
          scripts/run_core_validation_001.py
          scripts/report_core_validation_001.py
          scripts/publish_core_validation_001.py
          tests/test_core_validation_001.py
