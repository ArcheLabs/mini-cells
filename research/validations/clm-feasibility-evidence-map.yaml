open_gaps:
  - id: G1a
    claim: learned Cell coordinates and read/write alignment form without hidden task/factor labels when factors receive singleton exposure
    experiment: constructive-clm-001
    status: supported
  - id: G1b
    claim: latent Cell coordinates can be recovered when no hidden factor is ever presented alone
    experiment: constructive-clm-001b
    status: supported
    boundary: additive pair-superposition scaffold; arbitrary blind source separation remains open
  - id: G2
    claim: long-horizon Cell growth tracks reusable latent structure rather than transaction count and shows declining state/spawn ratios on the registered horizon
