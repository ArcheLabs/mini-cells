    claim: learned coordinates integrate with the existing replay-free certificate mechanism
    experiment: constructive-clm-003
  - id: G4
    claim: multiple learned Cells compose safely at model level
    experiment: constructive-clm-004
  - id: G5
    claim: external CLM scaffolding can be removed progressively toward endogenous CLM
    experiment: constructive-clm-005
native_route_stop_rule:
  require_repeated_failure_of:
    - reusable_learned_coordinates_under_progressively_weaker_scaffolds
    - deployable_read_write_alignment
    - bounded_or_improving_growth
  natural_geometry_negative_is_not_stop: true
