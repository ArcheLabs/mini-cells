name: JAM Knowledge Mutation 001 failure diagnostic guard

on:
  pull_request:
    paths:
      - '.github/workflows/jam-knowledge-mutation-001-failure-diagnostic.yml'
      - 'research/governance/catalog.yaml'
      - 'research/projects/safe-model-evolution/experiments/jam-knowledge-mutation-001-failure-diagnostic/validation/jam-knowledge-mutation-001-failure-diagnostic/**'
      - 'research/projects/safe-model-evolution/experiments/jam-knowledge-mutation-001-failure-diagnostic/notebook.ipynb'
      - 'research/projects/safe-model-evolution/context/07-safe-model-evolution/_notebook-index/07-safe-model-evolution-README.md'
      - 'research/projects/safe-model-evolution/context/07-safe-model-evolution/hypothesis/README.md'
      - 'scripts/research/jam_knowledge_mutation_001_failure_diagnostic/**'
      - 'tests/test_jam_knowledge_mutation_failure_diagnostic.py'
      - 'research/projects/safe-model-evolution/experiments/jam-knowledge-mutation-001/validation/jam-knowledge-mutation-001/**'
      - 'research/projects/safe-model-evolution/context/07-safe-model-evolution/datasets/jam-knowledge-v0.1/**'
      - 'research/projects/safe-model-evolution/experiments/jam-knowledge-mutation-001/artifacts/**'
  workflow_dispatch:

jobs:
  engineering-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU research environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[lm,dev]'

      - name: Validate frozen upstream artifacts and diagnostic plan
        run: |
          python -m json.tool research/projects/safe-model-evolution/experiments/jam-knowledge-mutation-001-failure-diagnostic/validation/jam-knowledge-mutation-001-failure-diagnostic/diagnostic_plan.json >/dev/null
          python -c "from pathlib import Path; import yaml; data=yaml.safe_load(Path('research/governance/catalog.yaml').read_text()); assert data['schema'] == 'minicells.research-catalog.v1'; assert any(row.get('id') == 'jam-knowledge-mutation-001-failure-diagnostic' for row in data['entries'])"
          python research/projects/safe-model-evolution/context/07-safe-model-evolution/scripts/research/jam_knowledge_mutation_001_failure_diagnostic/validate_sources.py

      - name: Compile diagnostic runners
        run: |
          python -m py_compile \
            research/projects/safe-model-evolution/context/07-safe-model-evolution/scripts/research/jam_knowledge_mutation_001_failure_diagnostic/segmentation.py \
            research/projects/safe-model-evolution/context/07-safe-model-evolution/scripts/research/jam_knowledge_mutation_001_failure_diagnostic/validate_sources.py \
            research/projects/safe-model-evolution/context/07-safe-model-evolution/scripts/research/jam_knowledge_mutation_001_failure_diagnostic/run_diagnostic.py \
            research/projects/safe-model-evolution/context/07-safe-model-evolution/scripts/research/jam_knowledge_mutation_001_failure_diagnostic/publish.py

      - name: Lint diagnostic implementation
        run: |
          python -m ruff check --ignore SIM102,S110,BLE001,UP012 \
            research/projects/safe-model-evolution/context/07-safe-model-evolution/scripts/research/jam_knowledge_mutation_001_failure_diagnostic/segmentation.py \
            research/projects/safe-model-evolution/context/07-safe-model-evolution/scripts/research/jam_knowledge_mutation_001_failure_diagnostic/validate_sources.py \
            research/projects/safe-model-evolution/context/07-safe-model-evolution/scripts/research/jam_knowledge_mutation_001_failure_diagnostic/publish.py \
            tests/test_jam_knowledge_mutation_failure_diagnostic.py
          python -m ruff check --ignore SIM102,S110,BLE001,UP012,I001 \
            research/projects/safe-model-evolution/context/07-safe-model-evolution/scripts/research/jam_knowledge_mutation_001_failure_diagnostic/run_diagnostic.py

      - name: Unit tests
        run: |
          python -m pytest -q tests/test_jam_knowledge_mutation_failure_diagnostic.py
