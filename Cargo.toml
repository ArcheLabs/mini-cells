[workspace]
resolver = "2"
exclude = [".deps/minijam-client"]
members = [
  "crates/minicells-core",
  "crates/minicells-protocol",
  "crates/minicells-runtime",
  "crates/minicells-service",
  "crates/minicells-sim",
  "crates/minicells-chain",
  "crates/minicells-cli",
  "crates/minicells-keeper",
  "crates/minicells-wasm",
  "crates/minicells-dataset",
  "crates/minicells-lab",
  "crates/minicells-pvm",
  "crates/minicells-training-ref",
  "crates/minicells-training-service",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["ArcheLabs"]
homepage = "https://github.com/ArcheLabs/mini-cells"
repository = "https://github.com/ArcheLabs/mini-cells"
rust-version = "1.88"

[workspace.lints.rust]

[workspace.dependencies]
blake2b_simd = { version = "1.0.4", default-features = false }
base64 = "0.22.1"
async-trait = "0.1.89"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
axum = "0.8.4"
tower-http = { version = "0.6", features = ["cors", "limit"] }
thiserror = "2.0.18"
tempfile = "3.23.0"
cid = "0.11.1"
multihash = "0.19.3"
bounded-collections = { version = "0.2.4", default-features = false }
getrandom = "0.3.4"
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
unicode-normalization = "0.1.25"
clap = { version = "4.5.13", features = ["derive"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
schnorrkel = "0.11.5"
jp-vm-engine = { path = ".deps/minijam-client/external/jambda/vm/engine" }
jp-vm-interp = { path = ".deps/minijam-client/external/jambda/vm/interp" }
jp-vm-primitives = { path = ".deps/minijam-client/external/jambda/vm/primitives" }

[patch.crates-io]
minijam-jamcore-api = { path = ".deps/minijam-client/crates/minijam-jamcore-api" }
minijam-protocol = { path = ".deps/minijam-client/crates/minijam-protocol" }

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
