[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-cells"
version = "0.2.0a1"
description = "Research toolkit for Cellular Language Models and reversible HybridCLM Cell mutations"
authors = [{name = "ArcheLabs"}]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["cellular-language-model", "moe", "model-evolution", "machine-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
urls = {Homepage = "https://github.com/ArcheLabs/mini-cells", Repository = "https://github.com/ArcheLabs/mini-cells", Documentation = "https://github.com/ArcheLabs/mini-cells/tree/main/docs", Issues = "https://github.com/ArcheLabs/mini-cells/issues"}
requires-python = ">=3.11"
dependencies = ["torch", "numpy", "pyyaml", "matplotlib", "pandas", "tokenizers>=0.15"]

[project.scripts]
minicells-clm = "minicells.cli:main"
minicells = "minicells.hybrid_cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff==0.16.6", "build>=1.2", "twine>=5.0"]
lm = ["datasets>=2.18", "transformers>=4.40,<5", "huggingface_hub>=0.23"]
hybrid = ["transformers>=4.40,<5", "huggingface_hub>=0.23", "safetensors>=0.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "unit: isolated software tests",
  "integration: multi-component integration tests",
  "research: scientific experiment regression tests",
  "smoke: low-cost execution smoke tests",
  "gpu: requires CUDA/GPU",
]

[tool.ruff]
line-length = 100
target-version = "py311"
