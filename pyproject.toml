[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-cells"
version = "0.1.0"
description = "MiniCells research on sparse, transactional, growth-capable Cellular Language Models"
requires-python = ">=3.11"
dependencies = ["torch", "numpy", "pyyaml", "matplotlib", "pandas", "tokenizers>=0.15"]

[project.scripts]
minicells-clm = "minicells.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
lm = ["datasets>=2.18"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "unit: isolated software tests",
  "integration: multi-component integration tests",
  "research: scientific experiment regression tests",
  "smoke: low-cost execution smoke tests",
  "gpu: requires CUDA/GPU",
]

[tool.ruff]
line-length = 100
target-version = "py311"
