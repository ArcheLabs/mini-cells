[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-cells"
version = "0.1.0"
description = "MINI Cells research experiments"
requires-python = ">=3.11"
dependencies = ["torch", "numpy", "pyyaml", "matplotlib", "pandas"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
lm = ["datasets>=2.18", "tokenizers>=0.15"]

[tool.setuptools]
package-dir = {"" = "research"}

[tool.setuptools.packages.find]
where = ["research"]

[tool.pytest.ini_options]
pythonpath = ["research"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
